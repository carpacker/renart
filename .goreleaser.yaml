version: 2

builds:
  - id: renart-duckdb-linux-amd64
    binary: renart
    main: ./
    env:
      - CC=/root/.cache/renart/zig/0.15.2/zig cc -target x86_64-linux-gnu.2.31
      - CXX=/root/.cache/renart/zig/0.15.2/zig c++ -target x86_64-linux-gnu.2.31
      - CGO_ENABLED=1
      - CGO_LDFLAGS=-L/root/.cache/renart/bruin-sqlparser-stub/linux-amd64/release
    flags:
      - -trimpath
      - -tags=no_duckdb_arrow
    ldflags:
      - -s -w -X main.version={{ .Version }} -X renart/internal/pysdk.Version={{ .Version }}
    goos:
      - linux
    goarch:
      - amd64
    hooks:
      pre:
        - cmd: ./scripts/build_bruin_sqlparser_stub.sh linux-amd64

  - id: renart-duckdb-linux-arm64
    binary: renart
    main: ./
    env:
      - CC=/root/.cache/renart/zig/0.15.2/zig cc -target aarch64-linux-gnu.2.31
      - CXX=/root/.cache/renart/zig/0.15.2/zig c++ -target aarch64-linux-gnu.2.31
      - CGO_ENABLED=1
      - CGO_LDFLAGS=-L/root/.cache/renart/bruin-sqlparser-stub/linux-arm64/release
    flags:
      - -trimpath
      - -tags=no_duckdb_arrow
    ldflags:
      - -s -w -X main.version={{ .Version }} -X renart/internal/pysdk.Version={{ .Version }}
    goos:
      - linux
    goarch:
      - arm64
    hooks:
      pre:
        - cmd: ./scripts/build_bruin_sqlparser_stub.sh linux-arm64

  - id: renart-duckdb-darwin-amd64
    binary: renart
    main: ./
    env:
      - CC=o64-clang
      - CXX=o64-clang++
      - CGO_ENABLED=1
      - CGO_LDFLAGS=-L/root/.cache/renart/bruin-sqlparser-stub/darwin-amd64/release
      - MACOSX_DEPLOYMENT_TARGET=10.15
    flags:
      - -trimpath
      - -tags=no_duckdb_arrow
    ldflags:
      - -s -w -X main.version={{ .Version }} -X renart/internal/pysdk.Version={{ .Version }}
    goos:
      - darwin
    goarch:
      - amd64
    hooks:
      pre:
        - cmd: ./scripts/build_bruin_sqlparser_stub.sh darwin-amd64

  - id: renart-duckdb-darwin-arm64
    binary: renart
    main: ./
    env:
      - CC=oa64-clang
      - CXX=oa64-clang++
      - CGO_ENABLED=1
      - CGO_LDFLAGS=-L/root/.cache/renart/bruin-sqlparser-stub/darwin-arm64/release
      - MACOSX_DEPLOYMENT_TARGET=10.15
    flags:
      - -trimpath
      - -tags=no_duckdb_arrow
    ldflags:
      - -s -w -X main.version={{ .Version }} -X renart/internal/pysdk.Version={{ .Version }}
    goos:
      - darwin
    goarch:
      - arm64
    hooks:
      pre:
        - cmd: ./scripts/build_bruin_sqlparser_stub.sh darwin-arm64

  - id: renart-duckdb-windows-amd64
    binary: renart
    main: ./
    env:
      - CC=x86_64-w64-mingw32-gcc
      - CXX=x86_64-w64-mingw32-g++
      - CGO_ENABLED=1
      - CGO_LDFLAGS=-static-libgcc -static-libstdc++ -Wl,-Bstatic -lstdc++ -lwinpthread -Wl,-Bdynamic
    flags:
      - -trimpath
      - -tags=no_duckdb_arrow
      - -buildmode=exe
    ldflags:
      - -s -w -X main.version={{ .Version }} -X renart/internal/pysdk.Version={{ .Version }} -extldflags=-static
    goos:
      - windows
    goarch:
      - amd64
archives:
  - id: renart-duckdb-archives
    ids:
      - renart-duckdb-linux-amd64
      - renart-duckdb-linux-arm64
      - renart-duckdb-darwin-amd64
      - renart-duckdb-darwin-arm64
      - renart-duckdb-windows-amd64
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end -}}
      _duckdb
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md
      - third_party/licenses/**

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

release:
  draft: true
  make_latest: false

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
