name: goreleaser

on:
  pull_request:
  push:
    branches:
      - "release/**"
    tags:
      - "*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Make Go module cache writable
        run: echo "GOFLAGS=-modcacherw" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build web assets
        run: |
          cd web
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec playwright install --with-deps chromium
          corepack pnpm build

      - name: Restore generated icon assets
        run: |
          git restore web/public/icons/apple-touch-icon.png \
            web/public/icons/favicon.ico \
            web/public/icons/icon-128.png \
            web/public/icons/icon-192.png \
            web/public/icons/icon-256.png \
            web/public/icons/icon-32.png \
            web/public/icons/icon-48.png \
            web/public/icons/icon-512.png \
            web/public/icons/icon-64.png

      - name: Make release scripts executable
        run: chmod +x ./scripts/build_rustsqlparser_release_lib.sh

      - name: Run GoReleaser via goreleaser-cross
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -v "$PWD":/src \
            -w /src \
            goreleaser/goreleaser-cross:v1.26.2-3 \
            release --clean --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release build config via goreleaser-cross
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -v "$PWD":/src \
            -w /src \
            goreleaser/goreleaser-cross:v1.26.2-3 \
            release --snapshot --skip=publish --clean --verbose
