name: goreleaser

on:
  pull_request:
  push:
    branches:
      - "release/**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.sum

      - name: Make Go module cache writable
        run: echo "GOFLAGS=-modcacherw" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Rust SQL parser build
        uses: actions/cache@v4
        with:
          path: ~/.cache/renart/rustsqlparser/target
          key: ${{ runner.os }}-rustsqlparser-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-rustsqlparser-

      - name: Build web assets
        run: |
          cd web
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec playwright install --with-deps chromium
          corepack pnpm build

      - name: Restore generated icon assets
        run: |
          git restore web/public/icons/apple-touch-icon.png \
            web/public/icons/favicon.ico \
            web/public/icons/icon-128.png \
            web/public/icons/icon-192.png \
            web/public/icons/icon-256.png \
            web/public/icons/icon-32.png \
            web/public/icons/icon-48.png \
            web/public/icons/icon-512.png \
            web/public/icons/icon-64.png

      - name: Make release scripts executable
        run: chmod +x ./scripts/build_rustsqlparser_release_lib.sh

      - name: Prepare Docker build cache mounts
        run: |
          mkdir -p "$HOME/go/pkg/mod" "$HOME/.cache/go-build" "$HOME/.cargo/registry" "$HOME/.cargo/git" "$HOME/.cache/renart/rustsqlparser"

      - name: Run GoReleaser via goreleaser-cross
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/go/pkg/mod":/go/pkg/mod \
            -v "$HOME/.cache/go-build":/root/.cache/go-build \
            -v "$HOME/.cargo/registry":/root/.cargo/registry \
            -v "$HOME/.cargo/git":/root/.cargo/git \
            -v "$HOME/.cache/renart/rustsqlparser":/root/.cache/renart/rustsqlparser \
            -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -v "$PWD":/src \
            -w /src \
            goreleaser/goreleaser-cross:v1.26.2-3 \
            release --clean --verbose --parallelism=1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release build config via goreleaser-cross
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/go/pkg/mod":/go/pkg/mod \
            -v "$HOME/.cache/go-build":/root/.cache/go-build \
            -v "$HOME/.cargo/registry":/root/.cargo/registry \
            -v "$HOME/.cargo/git":/root/.cargo/git \
            -v "$HOME/.cache/renart/rustsqlparser":/root/.cache/renart/rustsqlparser \
            -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -v "$PWD":/src \
            -w /src \
            goreleaser/goreleaser-cross:v1.26.2-3 \
            release --snapshot --skip=publish --clean --verbose --parallelism=1

  python-sdk-wheel:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.sum

      - name: Build release SDK wheel
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Python SDK publication requires a stable vMAJOR.MINOR.PATCH tag; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          go run \
            -ldflags "-X renart/internal/pysdk.Version=$version" \
            ./internal/pysdk/cmd/buildwheel \
            -output dist/python-sdk

      - name: Upload SDK wheel
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: renart-python-wheel
          path: dist/python-sdk/*.whl
          if-no-files-found: error

  publish-python-sdk:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - goreleaser
      - python-sdk-wheel
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/renart
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download SDK wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: renart-python-wheel
          path: dist/python-sdk

      - name: Publish SDK wheel to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/python-sdk/
