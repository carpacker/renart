name: live e2e

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

concurrency:
  group: live-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.5
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Rust SQL parser build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/renart/rustsqlparser/target
          key: ${{ runner.os }}-rust-1.96.0-rustsqlparser-${{ hashFiles('go.sum', 'scripts/build_rustsqlparser_release_lib.sh') }}
          restore-keys: |
            ${{ runner.os }}-rustsqlparser-

      - name: Install web dependencies
        working-directory: web
        run: corepack pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: web
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Build web assets
        working-directory: web
        run: corepack pnpm build

      - name: Build Bruin Rust SQL parser library
        run: |
          libdir="$(./scripts/build_rustsqlparser_release_lib.sh x86_64-unknown-linux-gnu)"
          echo "CGO_LDFLAGS=-L${libdir}" >> "$GITHUB_ENV"

      - name: Verify Go module cache integrity
        run: go mod verify

      - name: Build Renart binary
        run: go build -o renart .

      - name: Run live e2e tests
        working-directory: web
        env:
          BRUIN_E2E_BINARY: ${{ github.workspace }}/renart
          PWTEST_CACHE_DIR: /dev/shm/bruin-playwright/cache
          RENART_E2E_LIVE_WORKERS: 1
        run: corepack pnpm exec playwright test --config=playwright.live.config.ts

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-e2e-artifacts
          path: /dev/shm/bruin-playwright/test-results
          if-no-files-found: ignore

      - name: Clean up live e2e containers
        if: always()
        run: |
          for prefix in renart-e2e-pg renart-e2e-ch renart-e2e-trino; do
            docker ps -aq --filter "name=$prefix" | xargs -r docker rm -f
          done
          docker network ls -q --filter "name=renart-e2e-warehouse" | xargs -r docker network rm
