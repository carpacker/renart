name: Bug report
description: Report reproducible behavior that does not work as expected.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, use the private reporting link in SECURITY.md instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the result you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest set of steps or example workspace that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Renart version
      placeholder: v0.3.4
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, browser, and warehouse or connection type.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove credentials, connection strings, tokens, and private data before posting.
      render: shell
